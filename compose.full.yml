name: salespilot

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: sale_root
      MYSQL_DATABASE: sale
      MYSQL_USER: sale
      MYSQL_PASSWORD: sale_pass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usale", "-psale_pass"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: [mysql-data:/var/lib/mysql]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  business-mock:
    build: ./business-mock
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sale?useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: sale
      SPRING_DATASOURCE_PASSWORD: sale_pass
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  mcp-server:
    build: ./mcp-server
    environment:
      SALE_BUSINESS_BASE_URL: http://business-mock:8080
    depends_on:
      business-mock: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9010/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  sale-agent:
    build: .
    environment:
      SALE_REDIS_URL: redis://redis:6379/0
      SALE_MCP_BASE_URL: http://mcp-server:9010
      SALE_BUSINESS_BASE_URL: http://business-mock:8080
      SALE_VECTOR_BACKEND: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      SALE_KNOWLEDGE_DB: /data/knowledge.db
    depends_on:
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
      mcp-server: {condition: service_started}
    volumes: [agent-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ai/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  seed:
    build: .
    command: ["python", "-m", "sale_agent.kb.seed"]
    environment:
      SALE_KNOWLEDGE_DB: /data/knowledge.db
      SALE_VECTOR_BACKEND: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
    depends_on:
      milvus: {condition: service_healthy}
    volumes: [agent-data:/data]
    profiles: ["seed"]

  business-seed:
    image: mysql:8.0
    environment:
      MYSQL_PWD: sale_pass
    command: ["sh", "-c", "mysql -h mysql -u sale sale < /seed/seed.sql"]
    volumes:
      - ./business-mock/src/main/resources/db/seed/seed.sql:/seed/seed.sql:ro
    depends_on:
      mysql: {condition: service_healthy}
    profiles: ["seed"]

  frontend:
    build: ./frontend-web
    ports: ["8088:80"]
    depends_on: [business-mock, sale-agent]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  agent-data:
