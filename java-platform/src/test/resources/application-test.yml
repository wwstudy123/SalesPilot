spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/agentkit}
    username: ${SPRING_DATASOURCE_USERNAME:agentkit}
    password: ${SPRING_DATASOURCE_PASSWORD:agentkit}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
