[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sale_agent"
version = "0.1.0"
description = "LangGraph-based agent runtime kernel with Internal API (skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "httpx>=0.27",
  "redis>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "sale-agent"}

[tool.setuptools.packages.find]
where = ["sale-agent"]
include = ["sale_agent*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "output"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
