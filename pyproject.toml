[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagt_agent"
version = "0.1.0"
description = "LangGraph-based agent runtime kernel with Internal API (skeleton)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["sagt_agent*"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "output"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
