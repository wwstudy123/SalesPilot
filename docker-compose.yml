services:
  postgres:
    image: postgres:16
    container_name: agentkit-postgres
    environment:
      POSTGRES_DB: agentkit
      POSTGRES_USER: agentkit
      POSTGRES_PASSWORD: agentkit
    ports:
      - "5432:5432"
    volumes:
      - agentkit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentkit -d agentkit"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agentkit-postgres-data:
