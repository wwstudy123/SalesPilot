server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/agentkit?sslmode=disable&TimeZone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:agentkit}
    password: ${SPRING_DATASOURCE_PASSWORD:agentkit}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

agentkit:
  internal-api-base-url: ${AGENTKIT_INTERNAL_API_BASE_URL:http://127.0.0.1:8000}
