server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/sale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:sale}
    password: ${SPRING_DATASOURCE_PASSWORD:sale_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

sale:
  internal-api-base-url: ${SALE_INTERNAL_API_BASE_URL:http://127.0.0.1:8000}
  jwt:
    secret: ${SALE_JWT_SECRET:sale-dev-jwt-secret-please-change-me-0123456789}
    ttl-hours: ${SALE_JWT_TTL_HOURS:12}
